name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Check and test
        run: make check
      - name: Run local demonstration
        run: make demo
      - name: Go and OpenSSL loopback interoperability
        run: make interop
      - name: Check demo evidence integrity
        run: |
          for bundle in results/demo/*; do
            (cd "$bundle" && sha256sum --status -c SHA256SUMS)
          done
